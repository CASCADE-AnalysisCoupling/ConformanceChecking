name: Deploy Update-Site

on:
    push:
        branches: [main,updatesite-deployment]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Set up the JDK
                uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: 17
                    cache: maven
            -   name: Build
                working-directory: edu.kit.kastel.sdq.coupling.models.conformance
                run: mvn clean verify
            -   name: Publish Update-Site
                uses: peaceiris/actions-gh-pages@v4
                with:
                    personal_token: ${{ secrets.UPDATE_SITE_DEPLOY_SECRET }}
                    external_repository: CASCADE-AnalysisCoupling/updatesite
                    destination_dir: conformance_checking/
                    publish_dir: edu.kit.kastel.sdq.coupling.models.conformance/Updatesite/target/repository
                    publish_branch: main
